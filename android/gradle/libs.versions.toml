[versions]
# The SDK version lives in android/gradle.properties (sdkVersion) and in the git tag.
agp = "8.13.2"
kotlin = "2.3.20"
# Keep in sync with Package.swift so both platforms run the same navigation engine.
ferrostar = "0.59.0"
maplibre-compose = "0.13.0"
compose-bom = "2026.02.01"
coroutines = "1.11.0"
okhttp = "5.3.2"
play-services-location = "21.3.0"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
core-ktx = "1.17.0"
junit = "4.13.2"
desugar-jdk-libs = "2.1.5"

[libraries]
ferrostar-core = { module = "com.stadiamaps.ferrostar:core", version.ref = "ferrostar" }
ferrostar-google-play-services = { module = "com.stadiamaps.ferrostar:google-play-services", version.ref = "ferrostar" }
ferrostar-ui-compose = { module = "com.stadiamaps.ferrostar:ui-compose", version.ref = "ferrostar" }
ferrostar-ui-maplibre = { module = "com.stadiamaps.ferrostar:ui-maplibre", version.ref = "ferrostar" }
maplibre-compose = { module = "org.maplibre.compose:maplibre-compose-android", version.ref = "maplibre-compose" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-services-location" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

junit = { module = "junit:junit", version.ref = "junit" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
