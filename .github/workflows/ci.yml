name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :navigation-core:testReleaseUnitTest :navigation-ui:testReleaseUnitTest
      - name: Build libraries and sample (release build runs R8 with the consumer rules)
        run: ./gradlew :navigation-core:assembleRelease :navigation-ui:assembleRelease :sample:assembleRelease
      - name: Publish locally, as JitPack does
        run: ./gradlew :navigation-core:publishToMavenLocal :navigation-ui:publishToMavenLocal --no-configuration-cache

  ios:
    name: iOS (not yet verified, so it does not block merges)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Build and test the Swift package
        # -skipMacroValidation: CI cannot click "Trust & Enable" for MapLibre's SwiftUI DSL macros.
        run: |
          xcodebuild test \
            -scheme RemaplyNavigation-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation \
            -skipPackagePluginValidation
      - name: Build the example app
        run: |
          xcodebuild build \
            -project ios/Example/RemaplyNavigationExample.xcodeproj \
            -scheme RemaplyNavigationExample \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
